[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
authors = ["BKNadir"]
repository = "https://github.com/BKNadir/LibreOrbit"
rust-version = "1.85"

[workspace.dependencies]
lo-core = { path = "crates/lo-core" }
lo-game = { path = "crates/lo-game" }
lo-protocol = { path = "crates/lo-protocol" }
lo-web = { path = "crates/lo-web" }
bytes = "1"
chrono = "0.4"
crc32fast = "1"
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync", "signal"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
