[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["BKNadir"]
repository = "https://github.com/BKNadir/LibreOrbit"
rust-version = "1.85"

[workspace.dependencies]
crc32fast = "1"
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
